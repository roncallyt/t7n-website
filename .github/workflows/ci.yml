name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"
  HUSKY: "0"
  NUXT_PUBLIC_SITE_URL: https://t7n.dev

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: quality-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    name: End-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Run end-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  deploy:
    name: Deploy production
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    needs: [quality, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: production
      url: https://t7n.dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Skip stale deployment
        id: deployment
        run: |
          remote_sha="$(git ls-remote origin refs/heads/master | cut -f1)"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "master advanced to $remote_sha; skipping $GITHUB_SHA"
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Ruby
        if: ${{ steps.deployment.outputs.current == 'true' }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Kamal
        if: ${{ steps.deployment.outputs.current == 'true' }}
        run: gem install kamal --version 2.11.0 --no-document

      - name: Configure deployment credentials
        if: ${{ steps.deployment.outputs.current == 'true' }}
        env:
          KAMAL_SSH_PRIVATE_KEY: ${{ secrets.KAMAL_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          KAMAL_REGISTRY_USERNAME: ${{ github.actor }}
          KAMAL_REGISTRY_PASSWORD: ${{ github.token }}
          NUXT_OG_IMAGE_SECRET: ${{ secrets.NUXT_OG_IMAGE_SECRET }}
          NUXT_LISTMONK_HOST: ${{ secrets.NUXT_LISTMONK_HOST }}
          NUXT_LISTMONK_LIST_ID: ${{ secrets.NUXT_LISTMONK_LIST_ID }}
          NUXT_LISTMONK_API_USERNAME: ${{ secrets.NUXT_LISTMONK_API_USERNAME }}
          NUXT_LISTMONK_API_TOKEN: ${{ secrets.NUXT_LISTMONK_API_TOKEN }}
        run: |
          test -n "$KAMAL_SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          test -n "$NUXT_OG_IMAGE_SECRET"
          test -n "$NUXT_LISTMONK_HOST"
          test -n "$NUXT_LISTMONK_LIST_ID"
          test -n "$NUXT_LISTMONK_API_USERNAME"
          test -n "$NUXT_LISTMONK_API_TOKEN"
          install -m 700 -d "$HOME/.ssh" .kamal
          install -m 600 /dev/null "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KAMAL_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          install -m 600 /dev/null "$HOME/.ssh/known_hosts"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh-keygen -F 80.190.76.16 -f "$HOME/.ssh/known_hosts" >/dev/null
          install -m 600 /dev/null .kamal/secrets
          printf 'KAMAL_REGISTRY_USERNAME=%s\n' "$KAMAL_REGISTRY_USERNAME" > .kamal/secrets
          printf 'KAMAL_REGISTRY_PASSWORD=%s\n' "$KAMAL_REGISTRY_PASSWORD" >> .kamal/secrets
          printf 'NUXT_OG_IMAGE_SECRET=%s\n' "$NUXT_OG_IMAGE_SECRET" >> .kamal/secrets
          printf 'NUXT_LISTMONK_HOST=%s\n' "$NUXT_LISTMONK_HOST" >> .kamal/secrets
          printf 'NUXT_LISTMONK_LIST_ID=%s\n' "$NUXT_LISTMONK_LIST_ID" >> .kamal/secrets
          printf 'NUXT_LISTMONK_API_USERNAME=%s\n' "$NUXT_LISTMONK_API_USERNAME" >> .kamal/secrets
          printf 'NUXT_LISTMONK_API_TOKEN=%s\n' "$NUXT_LISTMONK_API_TOKEN" >> .kamal/secrets

      - name: Deploy with Kamal
        if: ${{ steps.deployment.outputs.current == 'true' }}
        run: kamal deploy

      - name: Verify direct-origin health
        if: ${{ steps.deployment.outputs.current == 'true' }}
        run: |
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 3 --retry-all-errors \
            --resolve t7n.dev:443:80.190.76.16 \
            https://t7n.dev/up
